<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="t1 d1" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t1">Lead Truth Engine event pipeline</title>
  <desc id="d1">Activity from the website, Apollo, HeyReach, calls, and tracked links is accepted by an ingest step that checks where it came from, placed on a queue that will not count the same activity twice, and handed to a worker that reads the identifiers, flags internal traffic, matches the event to one person under a lock, and records what happened. A score is rebuilt from that record. A dashboard reads it through a check that always names a failed source instead of showing zero. A promotion gate and a safety switch stand between the score and anything that reaches a real person.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="760" fill="#ffffff"/>

  <text x="40" y="28" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.16em">SOURCES</text>

  <!-- ── sources ── -->
  <g>
    <rect x="40" y="42" width="164" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="122" y="66" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Website</text>
    <text x="122" y="83" text-anchor="middle" font-size="10.5" fill="#64748b">visits and checkout</text>

    <rect x="218" y="42" width="164" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="300" y="66" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Apollo</text>
    <text x="300" y="83" text-anchor="middle" font-size="10.5" fill="#64748b">email opens and clicks</text>

    <rect x="396" y="42" width="164" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="478" y="66" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">HeyReach</text>
    <text x="478" y="83" text-anchor="middle" font-size="10.5" fill="#64748b">LinkedIn activity</text>

    <rect x="574" y="42" width="164" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="656" y="66" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Calls &amp; RFQs</text>
    <text x="656" y="83" text-anchor="middle" font-size="10.5" fill="#64748b">quote requests</text>

    <rect x="752" y="42" width="164" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="834" y="66" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Tracked links</text>
    <text x="834" y="83" text-anchor="middle" font-size="10.5" fill="#64748b">campaign attribution</text>
  </g>

  <path d="M480 98 L480 122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ── 1: ingest (emphasis) ── -->
  <rect x="180" y="126" width="600" height="54" rx="11" fill="#0f172a"/>
  <text x="480" y="150" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">Every event proves which source sent it</text>
  <text x="480" y="168" text-anchor="middle" font-size="11" fill="#94a3b8">Apollo and HeyReach each carry their own key, so one cannot claim to be the other</text>

  <path d="M480 180 L480 204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ── 2: queue ── -->
  <rect x="180" y="208" width="556" height="54" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="204" y="232" font-size="13" font-weight="600" fill="#0f172a">Counted once, even if sent twice</text>
  <text x="204" y="250" font-size="11" fill="#64748b">a resend from Apollo or HeyReach is recognized and skipped</text>

  <rect x="752" y="208" width="164" height="54" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-dasharray="4 3"/>
  <text x="834" y="231" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Failures watched</text>
  <text x="834" y="247" text-anchor="middle" font-size="10" fill="#94a3b8">on a running schedule</text>
  <path d="M736 235 L750 235" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arw)"/>

  <path d="M480 262 L480 286" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ── 3: worker ── -->
  <rect x="60" y="290" width="840" height="118" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="98" y="314" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.12em">MATCHING WORKER</text>

  <g>
    <rect x="94" y="326" width="178" height="66" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="183" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Read the identifiers</text>
    <text x="183" y="365" text-anchor="middle" font-size="10.5" fill="#64748b">email, phone,</text>
    <text x="183" y="379" text-anchor="middle" font-size="10.5" fill="#64748b">LinkedIn ID</text>

    <rect x="292" y="326" width="178" height="66" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="381" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Flag internal traffic</text>
    <text x="381" y="365" text-anchor="middle" font-size="10.5" fill="#64748b">test and staff visits,</text>
    <text x="381" y="379" text-anchor="middle" font-size="10.5" fill="#64748b">never promoted</text>

    <rect x="490" y="320" width="198" height="78" rx="11" fill="#0f172a"/>
    <text x="589" y="345" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">Match to one person</text>
    <text x="589" y="363" text-anchor="middle" font-size="10.5" fill="#94a3b8">one lock per identifier,</text>
    <text x="589" y="377" text-anchor="middle" font-size="10.5" fill="#94a3b8">taken in a fixed order</text>
    <text x="589" y="391" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.08em">THE HARD PART, BELOW</text>

    <rect x="708" y="326" width="172" height="66" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="794" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Record what happened</text>
    <text x="794" y="365" text-anchor="middle" font-size="10.5" fill="#64748b">kept permanently,</text>
    <text x="794" y="379" text-anchor="middle" font-size="10.5" fill="#64748b">nothing overwritten</text>
  </g>

  <path d="M272 359 L290 359" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#arw)"/>
  <path d="M470 359 L488 359" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#arw)"/>
  <path d="M688 359 L706 359" stroke="#cbd5e1" stroke-width="1.4" marker-end="url(#arw)"/>

  <path d="M480 408 L480 432" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ── 4: score ── -->
  <rect x="140" y="436" width="680" height="58" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="480" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">One score per person, rebuilt from the record</text>
  <text x="480" y="478" text-anchor="middle" font-size="11" fill="#64748b">fades gradually, never fully forgotten, and never rewarded for more Apollo or HeyReach sends</text>

  <path d="M480 494 L480 518" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ── 5: data-trust ── -->
  <rect x="140" y="522" width="680" height="54" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="480" y="545" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Every dashboard says which source failed</text>
  <text x="480" y="563" text-anchor="middle" font-size="11" fill="#64748b">so Apollo or HeyReach being down never reads as zero interest</text>

  <path d="M480 576 L480 600" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ── 6: gates ── -->

  <rect x="120" y="604" width="340" height="102" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="144" y="632" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.12em">PROMOTION GATE</text>
  <text x="144" y="657" font-size="11.5" fill="#334155">Checks the rules, duplicate accounts,</text>
  <text x="144" y="673" font-size="11.5" fill="#334155">and opt-outs before anything reaches the CRM</text>
  <text x="144" y="691" font-size="10.5" fill="#94a3b8">or sends it to a person to review</text>

  <rect x="500" y="604" width="340" height="102" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="524" y="632" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.12em">SAFETY SWITCH</text>
  <text x="524" y="657" font-size="11.5" fill="#334155">Off by default for anyone not approved,</text>
  <text x="524" y="673" font-size="11.5" fill="#334155">so a bug cannot message a real customer</text>
  <text x="524" y="691" font-size="10.5" fill="#94a3b8">one switch, checked by every service</text>

  <path d="M290 706 L290 722" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>
  <path d="M670 706 L670 722" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arw)"/>

  <text x="290" y="741" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">CRM, or a review queue</text>
  <text x="670" y="741" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Sent, and always logged</text>
</svg>
