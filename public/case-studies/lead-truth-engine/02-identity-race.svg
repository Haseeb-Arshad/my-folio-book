<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t2 d2" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t2">The identity race, and the fix</title>
  <desc id="d2">Left: locking only the first identifier after sorting lets two events that share an email address but carry different anonymous IDs take different locks, run at the same time, and each create a separate person record for the same buyer. Right: reducing every identifier to a number and locking all of them in a fixed order makes the second event wait for the first, so only one person record is created. The fixed order is what stops the two locks from deadlocking each other.</desc>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="500" fill="#ffffff"/>

  <!-- ══════════ LEFT: the trap ══════════ -->
  <text x="30" y="30" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.14em">THE OBVIOUS IMPLEMENTATION</text>
  <text x="30" y="56" font-size="15" font-weight="600" fill="#0f172a" letter-spacing="-0.01em">Lock the first identifier after sorting</text>

  <rect x="30" y="74" width="420" height="392" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <rect x="50" y="94" width="170" height="62" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="68" y="115" font-size="12" font-weight="600" fill="#0f172a">Event A</text>
  <text x="68" y="132" font-size="10.5" fill="#64748b">anonymous id: A</text>
  <text x="68" y="147" font-size="10.5" fill="#64748b">email: buyer@example.test</text>

  <rect x="244" y="94" width="170" height="62" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="262" y="115" font-size="12" font-weight="600" fill="#0f172a">Event B</text>
  <text x="262" y="132" font-size="10.5" fill="#64748b">anonymous id: B</text>
  <text x="262" y="147" font-size="10.5" fill="#64748b">email: buyer@example.test</text>

  <path d="M135 156 L135 176" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a2)"/>
  <path d="M329 156 L329 176" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a2)"/>

  <rect x="50" y="180" width="170" height="44" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="135" y="199" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">Locks id A</text>
  <text x="135" y="215" text-anchor="middle" font-size="10" fill="#94a3b8">first after sorting</text>

  <rect x="244" y="180" width="170" height="44" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="329" y="199" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">Locks id B</text>
  <text x="329" y="215" text-anchor="middle" font-size="10" fill="#94a3b8">a different lock</text>

  <text x="232" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Different locks, so both run at once</text>
  <text x="232" y="264" text-anchor="middle" font-size="10.5" fill="#94a3b8">neither one sees what the other is writing</text>

  <path d="M135 272 L135 292" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a2)"/>
  <path d="M329 272 L329 292" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a2)"/>

  <rect x="50" y="296" width="170" height="48" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="135" y="317" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">Person record 1</text>
  <text x="135" y="333" text-anchor="middle" font-size="10" fill="#94a3b8">duplicate</text>

  <rect x="244" y="296" width="170" height="48" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="329" y="317" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">Person record 2</text>
  <text x="329" y="333" text-anchor="middle" font-size="10" fill="#94a3b8">duplicate</text>

  <rect x="50" y="366" width="364" height="76" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="68" y="391" font-size="11.5" font-weight="600" fill="#0f172a">Nothing raises an error</text>
  <text x="68" y="410" font-size="10.5" fill="#64748b">The score, the owner, and the campaign credit split across</text>
  <text x="68" y="425" font-size="10.5" fill="#64748b">two records, and the duplicate only surfaces later.</text>

  <!-- ══════════ RIGHT: the fix ══════════ -->
  <text x="510" y="30" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.14em">THE CORRECT DESIGN</text>
  <text x="510" y="56" font-size="15" font-weight="600" fill="#0f172a" letter-spacing="-0.01em">Lock every identifier, in a fixed order</text>

  <rect x="510" y="74" width="420" height="392" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="1.4"/>

  <rect x="530" y="94" width="170" height="62" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="548" y="115" font-size="12" font-weight="600" fill="#0f172a">Event A</text>
  <text x="548" y="132" font-size="10.5" fill="#64748b">anonymous id: A</text>
  <text x="548" y="147" font-size="10.5" fill="#64748b">email: buyer@example.test</text>

  <rect x="724" y="94" width="170" height="62" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="742" y="115" font-size="12" font-weight="600" fill="#0f172a">Event B</text>
  <text x="742" y="132" font-size="10.5" fill="#64748b">anonymous id: B</text>
  <text x="742" y="147" font-size="10.5" fill="#64748b">email: buyer@example.test</text>

  <path d="M615 156 L615 176" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a2)"/>
  <path d="M809 156 L809 176" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a2)"/>

  <rect x="530" y="180" width="364" height="50" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="712" y="201" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Reduce every identifier to a number, then sort</text>
  <text x="712" y="218" text-anchor="middle" font-size="10.5" fill="#64748b">both events now queue for the same lock: the shared email</text>

  <path d="M712 230 L712 250" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a2)"/>

  <rect x="530" y="254" width="170" height="50" rx="9" fill="#0f172a"/>
  <text x="615" y="275" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">A holds the lock</text>
  <text x="615" y="291" text-anchor="middle" font-size="10" fill="#94a3b8">released when done</text>

  <rect x="724" y="254" width="170" height="50" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="809" y="275" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">B waits its turn</text>
  <text x="809" y="291" text-anchor="middle" font-size="10" fill="#64748b">then finds A's record</text>

  <path d="M712 304 L712 324" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a2)"/>

  <rect x="592" y="328" width="240" height="52" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
  <text x="712" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">One person record</text>
  <text x="712" y="369" text-anchor="middle" font-size="10.5" fill="#64748b">one score, one owner</text>

  <rect x="530" y="400" width="364" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="712" y="426" text-anchor="middle" font-size="10.5" fill="#64748b">the fixed order is what keeps the two locks from deadlocking</text>
</svg>
